<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TDS 数据导入报告</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,"Microsoft YaHei",sans-serif;color:#334155;background:radial-gradient(circle at 12% 4%,#dbeafe,transparent 30%),radial-gradient(circle at 90% 12%,#ede9fe,transparent 30%),linear-gradient(145deg,#f8fafc,#eef2ff)}.shell{max-width:1180px;margin:auto;padding:24px}.glass{background:rgba(255,255,255,.73);border:1px solid rgba(255,255,255,.86);box-shadow:0 20px 60px rgba(51,65,85,.11);backdrop-filter:blur(20px)}header{padding:15px 18px;border-radius:20px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:12px;align-items:center}.icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:white;background:linear-gradient(135deg,#3b82f6,#6366f1)}h1{font-size:16px;margin:0}.sub,.hint{font-size:10px;color:#64748b;margin-top:4px}.badge{font-size:10px;border:1px solid #dbeafe;border-radius:999px;padding:6px 10px;background:#eff6ff}.uploads{display:grid;grid-template-columns:1fr 1fr;gap:18px}.drop{min-height:225px;border-radius:22px;border:1.5px dashed #93c5fd;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:.25s}.drop:hover,.drop.drag{transform:translateY(-2px);border-color:#3b82f6}.drop.ready{border-color:#34d399;background:rgba(236,253,245,.64)}.drop b{font-size:14px;margin-top:10px}.drop p{font-size:10px;color:#64748b}.filelist{width:100%;max-height:108px;overflow:auto;margin-top:10px;display:flex;flex-direction:column;gap:5px}.file{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:9px;background:rgba(255,255,255,.7);font-size:10px;color:#047857;text-align:left}.remove{border:0;background:transparent;color:#ef4444;cursor:pointer}.name{font-size:11px!important;color:#059669!important;font-weight:700;word-break:break-all}.action{position:relative;width:100%;height:54px;margin:18px 0;border:0;border-radius:17px;overflow:hidden;color:white;font-weight:700;background:linear-gradient(100deg,#3b82f6,#6366f1);cursor:pointer;box-shadow:0 12px 30px rgba(79,70,229,.22)}.fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#10b981,#14b8a6);transition:width .5s}.action span:last-child{position:relative;z-index:2}.preview{padding:18px;border-radius:20px}.hidden{display:none}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.summary{font-size:10px;color:#64748b;margin-top:5px}.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:9px;margin-top:8px}.pill{padding:4px 8px;border-radius:999px}.p-tds{background:#dcfce7;color:#047857}.p-blank{background:#dbeafe;color:#1d4ed8}.p-missing{background:#fee2e2;color:#b91c1c}.p-conflict{background:#fef3c7;color:#b45309}.tablebox{max-height:420px;overflow:auto;border:1px solid #e2e8f0;border-radius:13px;margin-top:12px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:center}thead{position:sticky;top:0;background:#f1f5f9;z-index:2}.source{text-align:left;max-width:290px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.toast{position:fixed;right:20px;bottom:20px;background:#0f172a;color:white;padding:11px 15px;border-radius:12px;font-size:11px}.emptywarn{color:#b45309;font-size:10px;margin-top:8px}@media(max-width:760px){.uploads{grid-template-columns:1fr}.badge{display:none}.head{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="shell"><header class="glass"><div class="brand"><div class="icon">↔</div><div><h1>TDS 数据导入报告</h1><div class="sub">支持多份 TDS；无 TDS 数据的条款将使用空白模板清除旧数据</div></div></div><div id="health" class="badge">正在检查空白模板...</div></header><section class="uploads"><div id="tdsDrop" class="drop glass"><div>📚</div><b>多份已填写 TDS</b><p>一次或多次拖入 DOC / DOCX，最多 10 份</p><div id="tdsFiles" class="filelist"></div><input id="tdsInput" hidden multiple type="file" accept=".doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></div><div id="reportDrop" class="drop glass"><div>📄</div><b>原始测试报告</b><p>拖入一份 DOC / DOCX</p><p id="reportName" class="name"></p><input id="reportInput" hidden type="file" accept=".doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></div></section><button id="action" class="action"><i id="fill" class="fill"></i><span id="actionText">扫描并预览替换来源</span></button><section id="preview" class="preview glass hidden"><div class="head"><div><b>条款替换预览</b><div id="summary" class="summary"></div><div class="legend"><span class="pill p-tds">绿色：来自 TDS</span><span class="pill p-blank">蓝色：空白模板清除旧数据</span><span class="pill p-conflict">橙色：多份 TDS 重复，后上传优先</span><span class="pill p-missing">红色：没有替换来源</span></div></div><label class="hint"><input id="all" type="checkbox" checked> 全选可替换条款</label></div><div id="blankWarning" class="emptywarn hidden"></div><div class="tablebox"><table><thead><tr><th>选择</th><th>Clause</th><th>报告表格</th><th>替换表格</th><th>来源</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table></div></section><div id="toast" class="toast hidden"></div></main><script>
let tdsFiles=[],reportFile=null,job="",rows=[],phase="scan",busy=false;const $=x=>document.getElementById(x),toast=t=>{$("toast").textContent=t;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),3200)};function valid(f){const n=f.name.toLowerCase();return n.endsWith(".doc")||n.endsWith(".docx")}function fileKey(f){return `${f.name}|${f.size}|${f.lastModified}`}function reset(){if(busy)return;phase="scan";job="";rows=[];$("preview").classList.add("hidden");status("扫描并预览替换来源",0)}function renderFiles(){$("tdsFiles").innerHTML=tdsFiles.map((f,i)=>`<div class="file"><span>${i+1}. ${f.name}${f.name.toLowerCase().endsWith('.doc')?' · 自动转换':''}</span><button class="remove" data-i="${i}" type="button">×</button></div>`).join("");$("tdsDrop").classList.toggle("ready",tdsFiles.length>0);document.querySelectorAll('.remove').forEach(b=>b.onclick=e=>{e.stopPropagation();tdsFiles.splice(+b.dataset.i,1);renderFiles();reset()})}function addTds(list){const seen=new Set(tdsFiles.map(fileKey));for(const f of list){if(!valid(f)){toast(`忽略非 Word 文件：${f.name}`);continue}if(!seen.has(fileKey(f))&&tdsFiles.length<10){tdsFiles.push(f);seen.add(fileKey(f))}}renderFiles();reset()}function bindDrop(box,input,onFiles){box.onclick=()=>!busy&&input.click();input.onchange=()=>{onFiles([...input.files]);input.value=""};["dragover","dragenter"].forEach(e=>box.addEventListener(e,x=>{x.preventDefault();box.classList.add("drag")}));["drop","dragleave"].forEach(e=>box.addEventListener(e,x=>{x.preventDefault();box.classList.remove("drag")}));box.ondrop=e=>!busy&&onFiles([...e.dataTransfer.files])}bindDrop($("tdsDrop"),$("tdsInput"),addTds);bindDrop($("reportDrop"),$("reportInput"),files=>{const f=files[0];if(!f||!valid(f))return toast("请选择 DOC 或 DOCX 报告");reportFile=f;$("reportName").textContent=f.name+(f.name.toLowerCase().endsWith('.doc')?' · 将自动转换':'');$("reportDrop").classList.add("ready");reset()});function status(t,p){$("actionText").textContent=t+(p?` · ${Math.round(p)}%`:"");$("fill").style.width=p+"%"}$("action").onclick=()=>{if(!busy)(phase==="scan"?scan():start())};async function scan(){if(!tdsFiles.length||!reportFile)return toast("请至少上传一份 TDS 和一份报告");busy=true;status("正在扫描多份 TDS、报告和空白模板",15);let f=new FormData();tdsFiles.forEach(x=>f.append("tds",x));f.append("report",reportFile);try{let r=await fetch("/api/preview",{method:"POST",body:f}),d=await r.json();if(!r.ok)throw Error(d.detail||"扫描失败");job=d.job_id;rows=d.rows;render(d);phase="import";status("将 TDS 数据导入报告并清空旧数据",0)}catch(e){toast(e.message);status("扫描并预览替换来源",0)}finally{busy=false}}function render(d){$("summary").textContent=`${d.tds_file_count} 份 TDS · TDS 数据 ${d.tds_count} 条 · 空白替换 ${d.blank_count} 条 · 缺少来源 ${d.missing_count} 条 · 重复条款 ${d.conflict_count} 条`;$("blankWarning").classList.toggle("hidden",!!d.blank_template);$("blankWarning").textContent=d.blank_template?"":'未检测到空白模板：请把全空白 DOCX 放入 blank-templates 目录';$("rows").innerHTML=rows.map((x,i)=>{const cls=x.source==='tds'?(x.conflict?'p-conflict':'p-tds'):x.source==='blank'?'p-blank':'p-missing';const source=x.source==='tds'?`TDS：${x.source_name}`:x.source==='blank'?`空白模板：${x.source_name}`:'无';const state=x.source==='tds'?(x.conflict?'重复条款，使用最后上传的 TDS':'导入新数据'):x.source==='blank'?'清除报告旧数据':'跳过，不修改';return `<tr><td><input class="ck" data-i="${i}" type="checkbox" ${x.selected?'checked':''} ${x.source==='none'?'disabled':''}></td><td>${x.clause}</td><td>${x.report_tables}</td><td>${x.replacement_tables}</td><td class="source"><span class="pill ${cls}" title="${source}">${source}</span></td><td>${state}</td></tr>`}).join("");$("preview").classList.remove("hidden")}$("all").onchange=e=>document.querySelectorAll(".ck:not(:disabled)").forEach(x=>x.checked=e.target.checked);async function start(){let clauses=[...document.querySelectorAll(".ck:checked")].map(x=>rows[+x.dataset.i].clause);if(!clauses.length)return toast("请至少选择一个可替换条款");busy=true;let f=new FormData();f.append("clauses_json",JSON.stringify(clauses));let r=await fetch(`/api/start/${job}`,{method:"POST",body:f}),d=await r.json();if(!r.ok){busy=false;return toast(d.detail||"启动失败")}poll()}async function poll(){try{let r=await fetch(`/api/jobs/${job}`),d=await r.json();status(d.message||"正在导入",d.progress||0);if(d.status==="done"){await download(d.output_name);busy=false;phase="scan";return}if(d.status==="failed")throw Error(d.message);setTimeout(poll,900)}catch(e){busy=false;toast(e.message)}}async function download(name){let r=await fetch(`/api/download/${job}`);if(!r.ok)throw Error("下载失败");let b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name||"Imported_from_TDS.docx";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);status("导入完成，文件已下载",100)}async function health(){try{const d=await fetch('/api/health').then(r=>r.json());$("health").textContent=`空白模板：${d.blank_template_ready?d.blank_template:'未配置'} · DOC转换：${d.doc_conversion?'可用':'不可用'}`}catch(e){$("health").textContent='服务状态读取失败'}}health();
</script></body></html>
